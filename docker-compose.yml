services:
  codearts2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: codearts2api:latest
    container_name: codearts2api
    restart: unless-stopped
    # 仅暴露到宿主机回环地址，保持上游项目「不对外开放」的设计意图；
    # 若确实需要局域网访问，改成 "8787:8787"。
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # AK/SK 从同目录 .env 或宿主环境变量读取，不写进镜像
      CODEARTS_AK: ${CODEARTS_AK:?请在 .env 中配置 CODEARTS_AK}
      CODEARTS_SK: ${CODEARTS_SK:?请在 .env 中配置 CODEARTS_SK}
      CODEARTS_PROXY_HOST: 0.0.0.0
      CODEARTS_PROXY_PORT: "8787"
    volumes:
      # 模型缓存持久化，容器重建后无需重新拉取模型列表
      - ./models-cache.json:/app/models-cache.json
